server:
  port: 8080

spring:
  application:
    name: agv-scheduler
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agv_fleet}
    username: ${SPRING_DATASOURCE_USERNAME:agv}
    password: ${SPRING_DATASOURCE_PASSWORD:agv123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id-prefix: scheduler
  username: ${MQTT_USER:}
  password: ${MQTT_PASSWORD:}
  qos: 1

agv:
  # 调度 tick：取出到期可执行任务
  dispatch-tick-ms: 1000
  # AGV 心跳超时（毫秒），超过则判定宕机并强制重分配
  heartbeat-timeout-ms: 8000
  # 机器人空闲多久后可被高优任务抢占（毫秒），0 表示任何时候都允许抢占
  preempt-idle-threshold-ms: 0
  # ---- 电量管理 ----
  # 低电量告警阈值（%）：空闲车低于该值自动生成充电任务回桩
  low-battery-threshold: 25
  # 严重低电量阈值（%）：执行中车辆低于该值告警（不打断在途任务），送达后立即回充
  critical-battery-threshold: 15
  # 充满判定（%）：达到该电量结束充电任务，恢复空闲可派单
  charge-target-battery: 95
  # 在桩充电停靠时长（秒）
  charge-dwell-seconds: 30
  # 电量巡检周期（毫秒）
  battery-sweep-ms: 2000

logging:
  level:
    com.agv: INFO
